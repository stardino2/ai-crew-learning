<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini Status Harness Evidence Report</title>
    <style>
      :root {
        --primary: #0066cc;
        --canvas: #ffffff;
        --parchment: #f5f5f7;
        --ink: #1d1d1f;
        --muted: #7a7a7a;
        --hairline: #e0e0e0;
        --radius-lg: 18px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--parchment);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Noto Sans KR", sans-serif;
      }

      main {
        width: min(880px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 56px 0;
      }

      .card {
        padding: 28px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius-lg);
        background: var(--canvas);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--primary);
        font-size: 14px;
        font-weight: 600;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 42px;
        font-weight: 600;
        letter-spacing: -0.28px;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.47;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <p class="eyebrow">Evidence report</p>
        <h1>아직 실행된 점검 배너 결과가 없습니다.</h1>
        <p>점검 배너 변경 후 하네스 로그, HTML snapshot, ops log 요약을 포함한 결과 리포트로 갱신됩니다.</p>
      </section>
    </main>
  </body>
</html>
